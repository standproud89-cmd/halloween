<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>4인 해골 두더지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#0b0b0d;--card:#18171a;--line:#3a1a1a;--fg:#eceaea;--muted:#9a9a9e;--red:#FF3131;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,sans-serif}
body{padding-inline:16px;padding-block:20px 40px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;font-weight:900}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp small{color:var(--muted);font-size:12px}
.chip{font:inherit;font-size:13px;font-weight:700;color:var(--fg);background:#0b0b0d;border:1px solid #3a3a3e;border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#0b0b0d}
.chip:disabled{opacity:.45;cursor:default}
.stage{position:relative;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#0b0b0d;user-select:none;-webkit-user-select:none;touch-action:none}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 18px;background:rgba(11,11,13,.9);border-bottom:1px solid var(--line)}
.hud .rd{font-weight:900;font-size:20px;text-align:center}
.hud .msg{justify-self:end;font-weight:900;font-size:18px;color:#ffd27a;text-align:right}
.hud .lv{font-weight:700;font-size:14px;color:var(--muted)}
.tbar{height:8px;background:#1d1d21}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF3131,#ff8a3d);transform-origin:left}
.lanes{display:grid;grid-template-columns:repeat(4,1fr)}
.lane{position:relative;border-right:2px dashed #3a1a1a;--c:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 5%,transparent),color-mix(in srgb,var(--c) 15%,transparent));padding:8px 8px 12px}
.lane:last-child{border-right:none}
.ltop{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px;font-weight:900;color:var(--c);font-size:clamp(12px,1.8vw,18px)}
.ltop b{color:#fff;font-size:clamp(16px,2.6vw,28px);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{position:relative;aspect-ratio:1/1.05;overflow:hidden;cursor:pointer;touch-action:none;border-radius:10px}
.cell .back{position:absolute;left:6%;right:6%;bottom:10%;height:30%;border-radius:50%;background:#050506;box-shadow:inset 0 6px 10px #000,0 0 0 3px color-mix(in srgb,var(--c) 28%,#2a2428)}
.cell .mob{position:absolute;left:14%;right:14%;bottom:20%;height:78%;transform:translateY(150%);transition:transform .11s ease-out;pointer-events:none}
.cell.up .mob{transform:translateY(0)}
.cell.hit .mob{transform:translateY(55%) rotate(-10deg);transition:transform .12s}
.cell .mob svg{width:100%;height:100%;display:block;overflow:visible}
.cell .front{position:absolute;left:4%;right:4%;bottom:6%;height:24%;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#1a1519,#0f0d10);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,#2a2428);pointer-events:none}
.cell .fx{position:absolute;left:0;right:0;top:6%;text-align:center;font-weight:900;font-size:clamp(14px,2.4vw,26px);pointer-events:none;opacity:0}
.cell .fx.go{animation:fx .6s ease-out}
@keyframes fx{0%{opacity:1;transform:translateY(8px) scale(.8)}100%{opacity:0;transform:translateY(-22px) scale(1.2)}}
.cell.bonk::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.5),transparent 60%);animation:bk .25s forwards;pointer-events:none}
@keyframes bk{to{opacity:0}}
.lane.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,11,13,.82);padding:16px;z-index:5}
.fin[hidden]{display:none}
.panel{text-align:center;max-width:620px}
.panel h2{margin:0 0 6px;font-size:clamp(22px,4.4vw,38px);font-weight:900;color:var(--red);text-shadow:0 0 24px rgba(255,49,49,.45)}
.panel p{margin:0 0 14px;color:#cfcfd3;font-size:clamp(13px,2vw,16px);line-height:1.55}
.big{font:inherit;font-weight:900;font-size:clamp(16px,2.6vw,22px);color:#0b0b0d;background:var(--red);border:none;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 0 34px rgba(255,49,49,.4)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.finger{position:fixed;z-index:50;pointer-events:none;width:44px;height:44px;margin:-8px 0 0 -22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#cfcfd3}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:26px;height:28px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <g id="skull">
   <path d="M50 4C24 4 9 22 9 44c0 14 6 22 14 27v12c0 4 3 7 7 7h40c4 0 7-3 7-7V71c8-5 14-13 14-27C91 22 76 4 50 4z" fill="#ECE6D3" stroke="#B9B19B" stroke-width="3"/>
   <ellipse cx="33" cy="46" rx="11" ry="13" fill="#17121a"/><ellipse cx="67" cy="46" rx="11" ry="13" fill="#17121a"/>
   <circle cx="33" cy="48" r="3.4" fill="#FF3131"/><circle cx="67" cy="48" r="3.4" fill="#FF3131"/>
   <path d="M50 58l-6 12h12z" fill="#17121a"/>
   <path d="M30 80v10M40 80v12M50 80v12M60 80v12M70 80v10" stroke="#B9B19B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="gold">
   <path d="M50 4C24 4 9 22 9 44c0 14 6 22 14 27v12c0 4 3 7 7 7h40c4 0 7-3 7-7V71c8-5 14-13 14-27C91 22 76 4 50 4z" fill="#FFD04A" stroke="#C98A00" stroke-width="3"/>
   <ellipse cx="33" cy="46" rx="11" ry="13" fill="#3a2600"/><ellipse cx="67" cy="46" rx="11" ry="13" fill="#3a2600"/>
   <circle cx="33" cy="48" r="3.4" fill="#fff"/><circle cx="67" cy="48" r="3.4" fill="#fff"/>
   <path d="M50 58l-6 12h12z" fill="#3a2600"/>
   <path d="M30 80v10M40 80v12M50 80v12M60 80v12M70 80v10" stroke="#C98A00" stroke-width="3" stroke-linecap="round"/>
   <path d="M22 18l8 10M78 18l-8 10M50 -2v10" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>
  <g id="pump">
   <ellipse cx="50" cy="56" rx="42" ry="36" fill="#FF8A1F" stroke="#B85200" stroke-width="3"/>
   <path d="M34 24c-8 12-8 52 0 64M50 20v72M66 24c8 12 8 52 0 64" fill="none" stroke="#B85200" stroke-width="3" opacity=".6"/>
   <rect x="46" y="10" width="9" height="16" rx="3" fill="#3A7A2A"/>
   <path d="M30 50l8-10 8 10zM54 50l8-10 8 10z" fill="#2b1500"/>
   <path d="M30 70q20 16 40 0" fill="none" stroke="#2b1500" stroke-width="5" stroke-linecap="round"/>
  </g>
 </defs>
</svg>

<div class="app">
  <div>
    <h1>💀 4인 해골 두더지</h1>
    <p class="sub">구멍에서 해골이 쑥! 올라오면 재빨리 <b>톡!</b> 두드리세요. 4명이 각자 자기 칸의 구멍을 맡아 동시에 잡고, 점수는 팀으로 합쳐져요.</p>
  </div>

  <div class="ctrl">
    <div class="grp"><small>난이도</small>
      <button class="chip" data-level="easy" aria-pressed="true">쉬움 (느릿느릿 · 해골만)</button>
      <button class="chip" data-level="hard" aria-pressed="false">어려움 (빠름 · 호박 조심!)</button>
    </div>
    <div class="grp">
      <button class="chip" id="bStart">▶ 시작</button>
      <button class="chip" id="bAuto">🤖 자동 시연</button>
      <button class="chip" id="bStop" disabled>⏹ 중지</button>
    </div>
  </div>

  <div class="legend">
    <span><svg viewBox="0 0 100 100"><use href="#skull"/></svg> 해골 +1</span>
    <span><svg viewBox="0 0 100 100"><use href="#gold"/></svg> 황금 해골 +3 (금방 숨어요)</span>
    <span><svg viewBox="0 0 100 100"><use href="#pump"/></svg> 호박 −2 (어려움, 누르면 안 돼요!)</span>
  </div>

  <div class="stage" id="stage">
    <div class="hud"><div class="lv" id="lv"></div><div class="rd" id="rd">준비</div><div class="msg" id="msg"></div></div>
    <div class="tbar"><i id="tb"></i></div>
    <div class="lanes" id="lanes"></div>
    <div class="fin" id="fin"></div>
  </div>
  <p class="note">4명이 한 화면을 4칸으로 나눠 쓰는 전자칠판 기준이에요. 칸마다 구멍 9개이고, 여러 명이 동시에 터치해도 괜찮아요.</p>
</div>

<script>
(()=>{
const P=[{n:'보라',c:'#B26BE8'},{n:'파랑',c:'#4C9BFF'},{n:'주황',c:'#FFB13B'},{n:'초록',c:'#3DDC84'}];
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const CFG=[
 {time:45,maxUp:2,gap:[350,800],life:[1100,1700],gold:.10,pump:0,stars:[40,70,100]},
 {time:45,maxUp:3,gap:[200,520],life:[650,1050],gold:.12,pump:.20,stars:[30,55,80]}
];
let level=0,G=null,raf=0,timers=[];
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
function clearAll(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);document.querySelectorAll('.finger').forEach(e=>e.remove());}

// ---------- 소리 ----------
let audio=null;
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio;}
function tone(f,d=.15,type='triangle',v=.2,when=0,f2){const c=ac(),t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
const sPop=()=>tone(300,.07,'sine',.05,0,520);
const sBonk=()=>{tone(220,.14,'square',.16,0,90);tone(880,.06,'triangle',.1,.02);};
const sGold=()=>[880,1175,1568].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.05));
const sBad=()=>{tone(140,.3,'sawtooth',.2,0,70);};
const sEnd=()=>[784,659,523,392].forEach((f,i)=>tone(f,.3,'triangle',.18,i*.11));
const sTick=(f)=>tone(f,.12,'square',.1);

// ---------- 화면 ----------
const lanesEl=$('lanes');
const cellHTML=(l,i)=>`<div class="cell" data-l="${l}" data-i="${i}"><div class="back"></div><div class="mob"><svg viewBox="0 0 100 100"><use href="#skull"/></svg></div><div class="front"></div><div class="fx"></div></div>`;
lanesEl.innerHTML=P.map((p,l)=>`
 <div class="lane" id="L${l}" style="--c:${p.c}">
  <div class="ltop"><span></span><b id="SC${l}">0</b></div>
  <div class="grid">${Array.from({length:9},(_,i)=>cellHTML(l,i)).join('')}</div>
 </div>`).join('');
const cell=(l,i)=>lanesEl.querySelector(`.cell[data-l="${l}"][data-i="${i}"]`);

function setType(l,i,type){
  const u=cell(l,i).querySelector('use');u.setAttribute('href',type==='gold'?'#gold':type==='pump'?'#pump':'#skull');
}
function fx(l,i,txt,color){const e=cell(l,i).querySelector('.fx');e.textContent=txt;e.style.color=color;e.style.textShadow='0 0 10px '+color;e.classList.remove('go');void e.offsetWidth;e.classList.add('go');}

// ---------- 게임 ----------
function start(auto){
  clearAll();ac();
  const C=CFG[level];
  G={phase:'play',auto:!!auto,t0:performance.now(),T:(auto?40:C.time)*1000,score:0,
     P:P.map(()=>({score:0,hits:0,combo:0,best:0,next:0,holes:Array.from({length:9},()=>({s:'down',until:0,type:'skull'}))}))};
  document.querySelectorAll('.cell').forEach(c=>{c.className='cell';});
  $('fin').hidden=true;$('bStop').disabled=false;
  $('lv').textContent=(level?'어려움':'쉬움')+(auto?' · 시연':'');
  P.forEach((_,l)=>{$('SC'+l).textContent='0';G.P[l].next=performance.now()+rnd(400,900)+l*150;});
  drawScore();sTick(880);
  raf=requestAnimationFrame(tick);
  if(auto)P.forEach((_,l)=>botLane(l));
}
function drawScore(){$('msg').textContent=`팀 점수 ${G.score}`;}
function tick(now){
  if(!G||G.phase!=='play')return;
  const C=CFG[level],left=Math.max(0,G.T-(now-G.t0));
  $('tb').style.transform=`scaleX(${left/G.T})`;$('rd').textContent=`⏱ ${Math.ceil(left/1000)}초`;
  if(left<=0){finish();return;}
  G.P.forEach((S,l)=>{
    // 숨기기
    S.holes.forEach((h,i)=>{if(h.s==='up'&&now>=h.until){hide(l,i);if(h.type==='skull'||h.type==='gold'){S.combo=0;}}});
    // 올리기
    const up=S.holes.filter(h=>h.s==='up').length;
    if(now>=S.next&&up<C.maxUp){
      const free=S.holes.map((h,i)=>h.s==='down'?i:-1).filter(i=>i>=0);
      if(free.length){
        const i=free[Math.floor(Math.random()*free.length)],h=S.holes[i];
        const r=Math.random();h.type=r<C.pump?'pump':r<C.pump+C.gold?'gold':'skull';
        h.s='up';h.until=now+(h.type==='gold'?rnd(450,650):rnd(...C.life));
        setType(l,i,h.type);cell(l,i).classList.add('up');sPop();
      }
      S.next=now+rnd(...C.gap);
    }
  });
  raf=requestAnimationFrame(tick);
}
function hide(l,i){const h=G.P[l].holes[i];h.s='down';const c=cell(l,i);c.classList.remove('up','hit');}
function whack(l,i){
  if(!G||G.phase!=='play')return;
  const S=G.P[l],h=S.holes[i],c=cell(l,i);
  if(h.s!=='up')return; // 빈 구멍은 무시
  h.s='hit';
  c.classList.add('hit','bonk');setTimeout(()=>c.classList.remove('bonk'),260);
  let pts;
  if(h.type==='pump'){pts=-2;S.combo=0;sBad();fx(l,i,'−2','#ff6a3d');$('L'+l).classList.remove('shake');void $('L'+l).offsetWidth;$('L'+l).classList.add('shake');}
  else{
    S.combo++;S.best=Math.max(S.best,S.combo);S.hits++;
    if(h.type==='gold'){pts=3;sGold();fx(l,i,'+3','#FFD04A');}else{pts=1;sBonk();fx(l,i,'+1','#7CFFA0');}
  }
  S.score=Math.max(0,S.score+pts);G.score=Math.max(0,G.score+pts);
  $('SC'+l).textContent=S.score;drawScore();
  setTimeout(()=>{h.s==='hit'&&(h.s='down');c.classList.remove('up','hit');},220);
}
lanesEl.addEventListener('pointerdown',e=>{
  const c=e.target.closest&&e.target.closest('.cell');if(!c)return;e.preventDefault();
  whack(+c.dataset.l,+c.dataset.i);
});

function startPanel(){return `<div class="panel"><h2>준비됐나요?</h2><p>4명이 한 칸씩 맡으세요.<br>구멍에서 <b>해골</b>이 올라오면 톡! 두드리세요.<br><b>황금 해골</b>은 3점, 어려움의 <b>호박</b>은 누르면 감점!<br>${CFG[0].time}초 동안 팀 점수를 올려요.</p><button class="big" id="bStart2">▶ 시작하기</button></div>`;}
function showStart(){$('fin').hidden=false;$('fin').innerHTML=startPanel();$('bStart2').onclick=()=>start(false);}
function stop(){clearAll();G=null;$('bStop').disabled=true;$('rd').textContent='준비';$('msg').textContent='';$('lv').textContent='';$('tb').style.transform='scaleX(1)';
  document.querySelectorAll('.cell').forEach(c=>{c.className='cell';});P.forEach((_,l)=>$('SC'+l).textContent='0');showStart();}
function finish(){
  if(!G||G.phase!=='play')return;
  G.phase='end';clearAll();sEnd();
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('up','hit'));
  const th=CFG[level].stars,sc=G.score,stars=sc>=th[2]?3:sc>=th[1]?2:sc>=th[0]?1:0;
  const mx=Math.max(1,...G.P.map(x=>x.score));
  const bars=P.map((p,i)=>`<div style="display:grid;grid-template-columns:54px 1fr 46px;gap:10px;align-items:center;font-size:14px;font-weight:700;margin:6px 0;color:${p.c}"><span>${p.n}</span><div style="height:14px;border-radius:7px;background:#1d1d21;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(G.P[i].score/mx*100)}%;background:${p.c}"></i></div><span>${G.P[i].score}점</span></div>`).join('');
  $('fin').innerHTML=`<div class="panel"><div style="font-size:clamp(28px,6vw,48px);letter-spacing:.1em">${[0,1,2].map(i=>i<stars?'⭐':'☆').join('')}</div>
  <h2>⏰ 시간 끝!</h2><p>${level?'어려움':'쉬움'} · 팀 점수 <b>${sc}</b> · 최고 연속 <b>${Math.max(...G.P.map(x=>x.best))}</b></p>
  <div style="max-width:420px;margin:0 auto 14px;text-align:left">${bars}</div>
  <button class="big" id="again">↻ 다시 도전</button></div>`;
  $('fin').hidden=false;$('bStop').disabled=true;$('again').onclick=()=>start(false);$('rd').textContent='⏱ 0초';
}

// ---------- 자동 시연 봇: 올라온 해골을 반응속도 뒤에 두드림 ----------
function botLane(l){
  const seen=new Set();
  const loop=()=>{
    if(!G||G.phase!=='play')return;
    const S=G.P[l];
    S.holes.forEach((h,i)=>{
      if(h.s!=='up')return;
      const key=i+':'+Math.round(h.until);if(seen.has(key))return;seen.add(key);
      const dec=h.type==='pump'&&Math.random()<.18;
      if(h.type==='pump'&&!dec)return;
      later(()=>{
        if(!G||G.phase!=='play'||S.holes[i].s!=='up')return;
        const r=cell(l,i).getBoundingClientRect();
        const f=document.createElement('div');f.className='finger';f.textContent='👆';f.style.background=P[l].c+'cc';f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height*.45)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),220);
        whack(l,i);
      },rnd(230,520));
    });
    later(loop,80);
  };
  loop();
}

document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',x===b));level=b.dataset.level==='hard'?1:0;}));
$('bStart').onclick=()=>start(false);$('bAuto').onclick=()=>start(true);$('bStop').onclick=stop;
showStart();
window.__sk={get G(){return G},start,whack};
})();
</script>

<script>
(()=>{
if(!(window.__EMBED||/[?&]embed=1/.test(location.search)))return;
const st=document.createElement('style');
st.textContent='.app>div:first-child,.ctrl,.legend,.note,h1,.sub,#again,#bAuto,#bStop{display:none!important}html,body{background:#000!important;overflow:hidden!important}body{padding:0!important}.app{max-width:none!important;gap:0!important}.stage{border:none!important;border-radius:0!important;min-height:643px}.panel{max-width:960px!important}.panel h2{font-size:76px!important;margin-bottom:14px!important}.panel p{font-size:30px!important;line-height:1.5!important;margin-bottom:22px!important}.big{font-size:36px!important;padding:20px 70px!important}.cell{aspect-ratio:1/1.8!important}';
document.body.appendChild(st);
let sent=false;
