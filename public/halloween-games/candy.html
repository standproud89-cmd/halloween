<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>4인 사탕 받기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#0b0b0d;--card:#18171a;--line:#3a1a1a;--fg:#eceaea;--muted:#9a9a9e;--red:#FF3131;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,sans-serif}
body{padding-inline:16px;padding-block:20px 40px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;font-weight:900}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp small{color:var(--muted);font-size:12px}
.chip{font:inherit;font-size:13px;font-weight:700;color:var(--fg);background:#0b0b0d;border:1px solid #3a3a3e;border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#0b0b0d}
.chip:disabled{opacity:.45;cursor:default}
.stage{position:relative;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#0b0b0d;line-height:0}
canvas{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,11,13,.82);padding:16px;line-height:1.5}
.ov[hidden]{display:none}
.panel{text-align:center;max-width:620px}
.panel h2{margin:0 0 6px;font-size:clamp(22px,4.4vw,38px);font-weight:900;color:var(--red);text-shadow:0 0 24px rgba(255,49,49,.45)}
.panel p{margin:0 0 14px;color:#cfcfd3;font-size:clamp(13px,2vw,16px)}
.big{font:inherit;font-weight:900;font-size:clamp(16px,2.6vw,22px);color:#0b0b0d;background:var(--red);border:none;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 0 34px rgba(255,49,49,.4)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#cfcfd3}
</style>

<div class="app">
  <div>
    <h1>🍬 4인 사탕 받기</h1>
    <p class="sub">하늘에서 사탕이 우수수! 내 칸의 <b>호박 바구니</b>를 손가락으로 좌우로 끌어서 사탕을 받으세요. 4명이 각자 자기 칸에서 받고, 점수는 팀으로 합쳐져요. <b>💀 해골은 피하세요!</b></p>
  </div>

  <div class="ctrl">
    <div class="grp"><small>난이도</small>
      <button class="chip" data-level="easy" aria-pressed="true">쉬움 (천천히 · 해골 적음)</button>
      <button class="chip" data-level="hard" aria-pressed="false">어려움 (빠름 · 해골 많음)</button>
    </div>
    <div class="grp">
      <button class="chip" id="bStart">▶ 시작</button>
      <button class="chip" id="bAuto">🤖 자동 시연</button>
      <button class="chip" id="bStop" disabled>⏹ 중지</button>
    </div>
  </div>
  <div class="legend"><span>🍬🍭🍫🍪 사탕 +1</span><span>🌟 황금 사탕 +3</span><span>💀 해골 −2 (바구니가 잠깐 멈춰요)</span></div>

  <div class="stage" id="stage">
    <canvas id="cv" width="1280" height="620" aria-label="4인 사탕 받기 게임 화면"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <p class="note">컴퓨터에서 혼자 해볼 때는 마우스로 칸 안에서 좌우로 끌면 돼요. 전자칠판에서는 4명이 각자 칸에서 손가락으로 바구니를 끌어요(여러 명이 동시에 가능).</p>
</div>

<script>
(()=>{
const W=1280,H=620,LW=W/4,BY=548,HUD=64,BW=130;
const P=[{n:'보라',c:'#B26BE8'},{n:'파랑',c:'#4C9BFF'},{n:'주황',c:'#FFB13B'},{n:'초록',c:'#3DDC84'}];
const SWEET=['🍬','🍭','🍫','🍪','🧁'];
const CFG=[
 {time:45,gap:[.32,.65],vy:[250,350],skull:.12,gold:.08,stars:[60,95,130]},
 {time:45,gap:[.2,.42],vy:[370,520],skull:.28,gold:.10,stars:[55,90,125]}
];
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const cv=$('cv'),ctx=cv.getContext('2d');
let level=0,G=null,raf=0,audio=null;
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};

function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio;}
function tone(f,d=.15,type='triangle',v=.2,when=0,f2){const c=ac(),t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
const sCatch=(k)=>tone(600+Math.min(k,12)*40,.1,'triangle',.14);
const sGold=()=>[880,1175,1568].forEach((f,i)=>tone(f,.15,'triangle',.16,i*.05));
const sBad=()=>tone(150,.3,'sawtooth',.2,0,70);
const sEnd=()=>[784,659,523,392].forEach((f,i)=>tone(f,.3,'triangle',.18,i*.11));
const sTick=(f)=>tone(f,.12,'square',.1);

function newState(auto){
  const C=CFG[level];
  return {phase:'count',auto:!!auto,t0:performance.now()+2500,T:(auto?40:C.time)*1000,now:0,score:0,
    L:P.map((_,l)=>({x:LW*l+LW/2,tx:LW*l+LW/2,score:0,combo:0,best:0,stun:0,next:.7+l*.1,items:[],fx:[]})),lastTick:9};
}
function start(auto){cancelAnimationFrame(raf);ac();G=newState(auto);$('ov').hidden=true;$('bStop').disabled=false;last=performance.now();raf=requestAnimationFrame(loop);}
function stop(){cancelAnimationFrame(raf);G=null;drags.clear();$('bStop').disabled=true;showStart();draw(null);}
function showStart(){$('ov').hidden=false;$('ov').innerHTML=`<div class="panel"><h2>준비됐나요?</h2><p>4명이 한 칸씩 맡으세요.<br>손가락으로 <b>호박 바구니</b>를 좌우로 끌어서 사탕을 받아요.<br><b>💀 해골</b>은 피하세요! 45초 동안 팀 점수를 올려요.</p><button class="big" id="bStart2">▶ 시작하기</button></div>`;$('bStart2').onclick=()=>start(false);}

// 입력: 포인터마다 처음 누른 칸을 기억 → 그 칸의 바구니만 따라감 (멀티터치)
const drags=new Map();
function xy(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const [x]=xy(e);const l=Math.max(0,Math.min(3,Math.floor(x/LW)));drags.set(e.pointerId,l);moveTo(l,x);});
cv.addEventListener('pointermove',e=>{const l=drags.get(e.pointerId);if(l==null)return;const [x]=xy(e);moveTo(l,x);});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>drags.delete(e.pointerId)));
function moveTo(l,x){if(!G||G.auto)return;G.L[l].tx=Math.max(LW*l+BW/2,Math.min(LW*(l+1)-BW/2,x));}
// 키보드(혼자 테스트): 마우스 이동만 사용

let last=0;
function loop(now){
  if(!G)return;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const C=CFG[level];
  G.now=(now-G.t0)/1000;
  if(G.phase==='count'){
    const left=Math.ceil(-G.now);if(left!==G.lastTick&&left>=1&&left<=3){G.lastTick=left;sTick(left===1?880:620);}
    if(G.now>=0){G.phase='play';}
  }
  if(G.phase==='play'){
    const rem=G.T/1000-G.now;
    G.L.forEach((S,l)=>{
      if(S.stun>0)S.stun-=dt;
      // 바구니 이동
      if(G.auto)botMove(S,l);
      const k=S.stun>0?0:1;S.x+=(S.tx-S.x)*Math.min(1,dt*24)*k;
      // 생성
      S.next-=dt;
      if(S.next<=0&&rem>0.8){
        const r=Math.random();const type=r<C.skull?'skull':r<C.skull+C.gold?'gold':'candy';
        S.items.push({x:LW*l+rnd(36,LW-36),y:HUD+10,vy:rnd(...C.vy),type,e:type==='skull'?'💀':type==='gold'?'🌟':SWEET[Math.floor(Math.random()*SWEET.length)],rot:rnd(-.4,.4)});
        S.next=rnd(...C.gap);
      }
      // 이동 + 충돌
      S.items.forEach(it=>{it.y+=it.vy*dt;it.rot+=dt*.8;});
      S.items=S.items.filter(it=>{
        if(it.y>=BY-26&&it.y<=BY+30&&Math.abs(it.x-S.x)<BW/2+8){
          if(it.type==='skull'){S.score=Math.max(0,S.score-2);G.score=Math.max(0,G.score-2);S.combo=0;S.stun=.7;sBad();S.fx.push({t:0,x:S.x,txt:'−2',c:'#ff6a6a'});}
          else{const p=it.type==='gold'?3:1;S.score+=p;G.score+=p;S.combo++;S.best=Math.max(S.best,S.combo);it.type==='gold'?sGold():sCatch(S.combo);S.fx.push({t:0,x:S.x,txt:'+'+p,c:it.type==='gold'?'#FFD04A':'#7CFFA0'});}
          return false;
        }
        if(it.y>H+30){if(it.type!=='skull')S.combo=0;return false;}
        return true;
      });
      S.fx=S.fx.filter(f=>(f.t+=dt)<.7);
    });
    if(rem<=0){finish();return;}
  }
  draw(G);
  raf=requestAnimationFrame(loop);
}
function finish(){
  G.phase='end';sEnd();cancelAnimationFrame(raf);draw(G);
  const th=CFG[level].stars,sc=G.score,stars=sc>=th[2]?3:sc>=th[1]?2:sc>=th[0]?1:0;
  const mx=Math.max(1,...G.L.map(x=>x.score));
  const bars=P.map((p,i)=>`<div style="display:grid;grid-template-columns:54px 1fr 54px;gap:10px;align-items:center;font-size:14px;font-weight:700;margin:6px 0;color:${p.c}"><span>${p.n}</span><div style="height:14px;border-radius:7px;background:#1d1d21;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(G.L[i].score/mx*100)}%;background:${p.c}"></i></div><span>${G.L[i].score}점</span></div>`).join('');
  $('ov').innerHTML=`<div class="panel"><div style="font-size:clamp(28px,6vw,48px);letter-spacing:.1em">${[0,1,2].map(i=>i<stars?'⭐':'☆').join('')}</div>
  <h2>⏰ 시간 끝!</h2><p>${level?'어려움':'쉬움'} · 팀 점수 <b>${sc}</b> · 최고 연속 <b>${Math.max(...G.L.map(x=>x.best))}</b></p>
  <div style="max-width:420px;margin:0 auto 14px;text-align:left">${bars}</div>
  <button class="big" id="again">↻ 다시 도전</button></div>`;
  $('ov').hidden=false;$('bStop').disabled=true;$('again').onclick=()=>start(false);
}

// 자동 시연 봇: 가장 가까운 사탕 쪽으로 이동, 해골은 피함
function botMove(S,l){
  const lo=LW*l+BW/2,hi=LW*(l+1)-BW/2;
  let best=null,bs=1e9;
  S.items.forEach(it=>{if(it.type==='skull')return;const d=(BY-it.y)/it.vy;if(d>-.1&&d<bs){bs=d;best=it;}});
  let tx=best?best.x:S.tx;
  // 해골이 목표 경로에 있으면 비켜섬
  S.items.forEach(it=>{if(it.type!=='skull')return;const d=(BY-it.y)/it.vy;if(d>0&&d<.9&&Math.abs(it.x-tx)<BW/2+22){tx+= (tx<it.x?-1:1)*(BW/2+30);}});
  // 가끔 실수
  if(S._slip&&S._slip>0){S._slip-=.016;tx=S.tx;}else if(Math.random()<.0025){S._slip=.5;}
  S.tx=Math.max(lo,Math.min(hi,tx));
}

// ---------- 그리기 ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function draw(g){
  ctx.clearRect(0,0,W,H);
  for(let l=0;l<4;l++){
    const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,hexA(P[l].c,.05));gr.addColorStop(1,hexA(P[l].c,.2));
    ctx.fillStyle=gr;ctx.fillRect(l*LW,0,LW,H);
    if(l){ctx.strokeStyle='#3a1a1a';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(l*LW,0);ctx.lineTo(l*LW,H);ctx.stroke();ctx.setLineDash([]);}
  }
  // 이름표
  for(let l=0;l<4;l++){
    ctx.fillStyle=hexA(P[l].c,.22);ctx.fillRect(l*LW,H-44,LW,44);
    ctx.fillStyle=P[l].c;ctx.font='900 22px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(g?String(g.L[l].score):'',l*LW+LW/2,H-22);
  }
  if(!g){ // 대기 장면
    [0,1,2,3].forEach(l=>{basket(l*LW+LW/2,BY,l,false);ctx.font='44px sans-serif';ctx.fillText(SWEET[l],l*LW+LW/2+20,200+l*40);});
    return;
  }
  g.L.forEach((S,l)=>{
    S.items.forEach(it=>{ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);ctx.font='46px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      if(it.type==='gold'){ctx.shadowColor='#FFD04A';ctx.shadowBlur=18;}ctx.fillText(it.e,0,0);ctx.restore();});
    basket(S.x,BY,l,S.stun>0);
    S.fx.forEach(f=>{const k=f.t/.7;ctx.globalAlpha=1-k;ctx.fillStyle=f.c;ctx.font='900 34px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.fillText(f.txt,f.x,BY-50-k*50);ctx.globalAlpha=1;});
  });
  // HUD
  ctx.fillStyle='rgba(11,11,13,.78)';ctx.fillRect(0,0,W,HUD);
  const rem=Math.max(0,g.T/1000-Math.max(0,g.now));
  ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle='#9a9a9e';ctx.font='700 20px "Noto Sans KR",sans-serif';ctx.fillText(level?'어려움':'쉬움',20,28);
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 30px "Noto Sans KR",sans-serif';ctx.fillText(`⏱ ${Math.ceil(rem)}초`,W/2,28);
  ctx.textAlign='right';ctx.fillStyle='#ffd27a';ctx.fillText(`팀 점수 ${g.score}`,W-20,28);
  ctx.fillStyle='#1d1d21';ctx.fillRect(0,HUD-8,W,8);ctx.fillStyle='#ff5a3d';ctx.fillRect(0,HUD-8,W*rem/(g.T/1000),8);
  if(g.phase==='count'){
    const left=Math.max(1,Math.ceil(-g.now));
    ctx.fillStyle='rgba(11,11,13,.45)';ctx.fillRect(0,HUD,W,H-HUD);
    ctx.textAlign='center';ctx.fillStyle='#FF3131';ctx.font='900 170px "Noto Sans KR",sans-serif';ctx.shadowColor='#FF3131';ctx.shadowBlur=30;ctx.fillText(String(left),W/2,H/2-20);ctx.shadowBlur=0;
    ctx.font='700 28px "Noto Sans KR",sans-serif';ctx.fillStyle='#ddd';ctx.fillText('바구니에 손가락을 올리세요',W/2,H/2+90);
  }
}
function basket(x,y,l,stun){
  ctx.save();ctx.translate(x,y);
  ctx.globalAlpha=stun?.55:1;
  ctx.fillStyle=P[l].c;ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-BW/2,-18);ctx.lineTo(BW/2,-18);ctx.lineTo(BW/2-16,26);ctx.lineTo(-BW/2+16,26);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.font='40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(stun?'😵':'🎃',0,4);
  ctx.restore();
}

document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',x===b));level=b.dataset.level==='hard'?1:0;}));
$('bStart').onclick=()=>start(false);$('bAuto').onclick=()=>start(true);$('bStop').onclick=stop;
showStart();draw(null);
window.__cd={get G(){return G},start};
})();
</script>

<script>
(()=>{
if(!(window.__EMBED||/[?&]embed=1/.test(location.search)))return;
const st=document.createElement('style');
st.textContent='.app>div:first-child,.ctrl,.legend,.note,h1,.sub,#again,#bAuto,#bStop{display:none!important}html,body{background:#000!important;overflow:hidden!important}body{padding:0!important}.app{max-width:none!important;gap:0!important}.stage{border:none!important;border-radius:0!important;min-height:643px}.panel{max-width:960px!important}.panel h2{font-size:76px!important;margin-bottom:14px!important}.panel p{font-size:30px!important;line-height:1.5!important;margin-bottom:22px!important}.big{font-size:36px!important;padding:20px 70px!important}';
document.body.appendChild(st);
let sent=false;
const chk=()=>{if(sent)return;for(const id of ['ov','fin']){const el=document.getElementById(id);if(el&&!el.hidden){const m=(el.innerText||'').match(/[\u2B50\u2606]{3}/);if(m){sent=true;el.style.visibility='hidden';const stars=(m[0].match(/\u2B50/g)||[]).length;setTimeout(()=>parent.postMessage({hw:'done',stars},'*'),700);}}}};
new MutationObserver(chk).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['hidden']});
const rep=()=>{const s=document.getElementById('stage');if(s)parent.postMessage({hw:'h',h:Math.ceil(s.getBoundingClientRect().height)},'*');};
addEventListener('resize',rep);const stg=document.getElementById('stage');if(window.ResizeObserver&&stg)new ResizeObserver(rep).observe(stg);setInterval(rep,400);rep();
})();
</script>
<style id="kiosk-css">html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}img,svg,canvas{-webkit-user-drag:none;user-drag:none}</style>
<script id="kiosk-js">(function(){var s=function(e){e.preventDefault()};
['contextmenu','dblclick','selectstart','dragstart','gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,s,{capture:true,passive:false})});
document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{capture:true,passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault()},{capture:true,passive:false});
document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['+','-','=','0','s','p','u','a','f'].indexOf(k)>-1)e.preventDefault()},true);})();</script>
