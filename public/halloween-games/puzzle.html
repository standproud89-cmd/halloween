<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>4인 도형 퍼즐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#0b0b0d;--card:#18171a;--line:#3a1a1a;--fg:#eceaea;--muted:#9a9a9e;--red:#FF3131;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,sans-serif}
body{padding-inline:16px;padding-block:20px 40px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;font-weight:900}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp small{color:var(--muted);font-size:12px}
.chip{font:inherit;font-size:13px;font-weight:700;color:var(--fg);background:#0b0b0d;border:1px solid #3a3a3e;border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#0b0b0d}
.chip:disabled{opacity:.45;cursor:default}
.stage{position:relative;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#0b0b0d;user-select:none;-webkit-user-select:none;touch-action:none}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 18px;background:rgba(11,11,13,.9);border-bottom:1px solid var(--line)}
.hud .rd{font-weight:900;font-size:20px;text-align:center}
.hud .msg{justify-self:end;font-weight:900;font-size:18px;color:#ffd27a;text-align:right}
.hud .lv{font-weight:700;font-size:14px;color:var(--muted)}
.tbar{height:8px;background:#1d1d21}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF3131,#ff8a3d);transform-origin:left}
.lanes{display:grid;grid-template-columns:repeat(4,1fr)}
.lane{position:relative;border-right:2px dashed #3a1a1a;--c:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 5%,transparent),color-mix(in srgb,var(--c) 14%,transparent));display:flex;flex-direction:column}
.lane:last-child{border-right:none}
.ltop{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 0;font-weight:900;color:var(--c);font-size:clamp(12px,1.7vw,17px);gap:6px}
.ltop .pg{font-variant-numeric:tabular-nums;color:#fff;opacity:.85;font-weight:700}
svg{width:100%;height:auto;display:block;touch-action:none}
.piece{cursor:grab;stroke:rgba(255,255,255,.7);stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 4px 5px rgba(0,0,0,.55));touch-action:none}
.piece.drag{cursor:grabbing;filter:drop-shadow(0 10px 12px rgba(0,0,0,.6))}
.piece.placed{cursor:default;filter:none;stroke:rgba(255,255,255,.35);pointer-events:none}
.slot{fill:#1c1c22;stroke-linejoin:round}
.zone{fill:none;stroke:#3a3a40;stroke-dasharray:6 6;stroke-width:1.5}
.lane.done svg{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.03)}}
.okmark{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-weight:900;font-size:clamp(40px,8vw,96px);color:#7CFFA0;text-shadow:0 0 30px #3DDC84;background:rgba(11,11,13,.45);pointer-events:none}
.lane.done .okmark{display:flex}
.fin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,11,13,.82);padding:16px;z-index:5}
.fin[hidden]{display:none}
.panel{text-align:center;max-width:620px}
.panel h2{margin:0 0 6px;font-size:clamp(22px,4.4vw,38px);font-weight:900;color:var(--red);text-shadow:0 0 24px rgba(255,49,49,.45)}
.panel p{margin:0 0 14px;color:#cfcfd3;font-size:clamp(13px,2vw,16px);line-height:1.55}
.big{font:inherit;font-weight:900;font-size:clamp(16px,2.6vw,22px);color:#0b0b0d;background:var(--red);border:none;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 0 34px rgba(255,49,49,.4)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.finger{position:fixed;z-index:50;pointer-events:none;width:44px;height:44px;margin:-8px 0 0 -22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #fff}
@media(max-width:700px){.ltop{font-size:11px}}
</style>

<div class="app">
  <div>
    <h1>🧩 4인 도형 퍼즐</h1>
    <p class="sub">위쪽의 <b>검은 그림자</b>와 똑같이 되도록, 아래 흩어진 조각을 <b>손가락으로 끌어다</b> 맞추세요. 맞는 자리에 가까이 가면 딸깍! 하고 붙어요. 다 맞추면 바로 다음 그림이 나와요 — 4명이 각자 자기 칸에서 동시에 풀고, 팀 점수를 합쳐요.</p>
  </div>

  <div class="ctrl">
    <div class="grp"><small>난이도</small>
      <button class="chip" data-level="easy" aria-pressed="true">쉬움 (3~5조각 · 선 보임)</button>
      <button class="chip" data-level="hard" aria-pressed="false">어려움 (5~7조각 · 선 숨김)</button>
    </div>
    <div class="grp">
      <button class="chip" id="bStart">▶ 시작</button>
      <button class="chip" id="bAuto">🤖 자동 시연</button>
      <button class="chip" id="bStop" disabled>⏹ 중지</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="hud"><div class="lv" id="lv"></div><div class="rd" id="rd">준비</div><div class="msg" id="msg"></div></div>
    <div class="tbar"><i id="tb"></i></div>
    <div class="lanes" id="lanes"></div>
    <div class="fin" id="fin"></div>
  </div>
  <p class="note">4명이 한 화면을 4칸으로 나눠 쓰는 전자칠판 기준이에요. 각자 자기 칸의 조각만 끌 수 있고, 여러 손가락이 동시에 움직여도 괜찮아요. (같은 모양 조각은 서로 자리가 바뀌어도 OK!)</p>
</div>

<script>
(()=>{
const P=[{n:'보라',c:'#B26BE8'},{n:'파랑',c:'#4C9BFF'},{n:'주황',c:'#FFB13B'},{n:'초록',c:'#3DDC84'}];
const VW=320,VH=540,OX=10,OY=10,SNAP=30;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- 퍼즐 데이터: 그림자(전체 모양)는 같고, 쉬움/어려움은 쪼개는 방식만 다름 ----------
// 좌표는 300x240 안의 절대 좌표. 각 조각은 점 배열.
const PUZZLES=[
 {id:'house',name:'🏠 집',
  easy:[[[150,20],[40,110],[260,110]],[[60,110],[150,110],[150,230],[60,230]],[[150,110],[240,110],[240,230],[150,230]]],
  hard:[[[150,20],[40,110],[260,110]],[[60,110],[120,110],[120,230],[60,230]],[[180,110],[240,110],[240,230],[180,230]],[[120,110],[180,110],[180,160],[120,160]],[[120,160],[180,160],[180,230],[120,230]]]},
 {id:'tree',name:'🎄 나무',
  easy:[[[150,10],[100,80],[200,80]],[[100,80],[200,80],[230,150],[70,150]],[[70,150],[230,150],[260,210],[40,210]],[[130,210],[170,210],[170,240],[130,240]]],
  hard:[[[150,10],[100,80],[200,80]],[[100,80],[150,80],[150,150],[70,150]],[[150,80],[200,80],[230,150],[150,150]],[[40,210],[70,150],[150,150],[150,210]],[[150,150],[230,150],[260,210],[150,210]],[[130,210],[170,210],[170,240],[130,240]]]},
 {id:'rocket',name:'🚀 로켓',
  easy:[[[150,10],[120,60],[180,60]],[[120,60],[180,60],[180,200],[120,200]],[[120,130],[120,200],[80,200]],[[180,130],[220,200],[180,200]],[[130,200],[170,200],[150,240]]],
  hard:[[[150,10],[120,60],[180,60]],[[120,60],[180,60],[180,110],[120,110]],[[120,110],[180,110],[180,200],[120,200]],[[120,130],[120,200],[80,200]],[[180,130],[220,200],[180,200]],[[130,200],[170,200],[150,240]]]},
 {id:'boat',name:'⛵ 배',
  easy:[[[145,20],[145,150],[70,150]],[[155,45],[220,150],[155,150]],[[145,20],[155,20],[155,160],[145,160]],[[40,160],[260,160],[220,220],[80,220]]],
  hard:[[[145,20],[145,150],[70,150]],[[155,45],[220,150],[155,150]],[[145,20],[155,20],[155,160],[145,160]],[[40,160],[80,160],[80,220]],[[80,160],[220,160],[220,220],[80,220]],[[220,160],[260,160],[220,220]]]},
 {id:'fish',name:'🐟 물고기',
  easy:[[[80,120],[150,70],[150,170]],[[150,70],[220,120],[150,170]],[[220,120],[270,75],[270,165]]],
  hard:[[[80,120],[150,70],[150,120]],[[150,70],[220,120],[150,120]],[[80,120],[150,120],[150,170]],[[150,120],[220,120],[150,170]],[[220,120],[270,75],[270,120]],[[220,120],[270,120],[270,165]]]},
 {id:'cat',name:'🐱 고양이',
  easy:[[[70,90],[70,30],[130,90]],[[230,90],[230,30],[170,90]],[[70,90],[230,90],[230,220],[70,220]]],
  hard:[[[70,90],[70,30],[130,90]],[[230,90],[230,30],[170,90]],[[70,90],[230,90],[230,130],[70,130]],[[70,130],[150,130],[150,220],[70,220]],[[150,130],[230,130],[230,220],[150,220]]]},
 {id:'car',name:'🚗 자동차',
  easy:[[[40,130],[260,130],[260,190],[40,190]],[[90,130],[120,80],[190,80],[220,130]],[[75,190],[95,190],[105,200],[105,220],[95,230],[75,230],[65,220],[65,200]],[[205,190],[225,190],[235,200],[235,220],[225,230],[205,230],[195,220],[195,200]]],
  hard:[[[40,130],[150,130],[150,190],[40,190]],[[150,130],[260,130],[260,190],[150,190]],[[90,130],[120,80],[155,80],[155,130]],[[155,80],[190,80],[220,130],[155,130]],[[75,190],[95,190],[105,200],[105,220],[95,230],[75,230],[65,220],[65,200]],[[205,190],[225,190],[235,200],[235,220],[225,230],[205,230],[195,220],[195,200]]]},
 {id:'castle',name:'🏰 성',
  easy:[[[40,80],[90,80],[90,230],[40,230]],[[210,80],[260,80],[260,230],[210,230]],[[40,80],[65,30],[90,80]],[[210,80],[235,30],[260,80]],[[90,120],[210,120],[210,230],[170,230],[170,170],[130,170],[130,230],[90,230]]],
  hard:[[[40,80],[90,80],[90,230],[40,230]],[[210,80],[260,80],[260,230],[210,230]],[[40,80],[65,30],[90,80]],[[210,80],[235,30],[260,80]],[[90,120],[210,120],[210,170],[90,170]],[[90,170],[130,170],[130,230],[90,230]],[[170,170],[210,170],[210,230],[170,230]]]},
 {id:'butterfly',name:'🦋 나비',
  easy:[[[143,100],[40,40],[30,120],[30,130],[70,210],[143,120]],[[157,100],[260,40],[270,120],[270,130],[230,210],[157,120]],[[143,60],[157,60],[157,200],[143,200]]],
  hard:[[[143,100],[40,40],[30,120]],[[143,120],[30,130],[70,210]],[[157,100],[260,40],[270,120]],[[157,120],[270,130],[230,210]],[[143,60],[157,60],[157,200],[143,200]]]},
 {id:'icecream',name:'🍦 아이스크림',
  easy:[[[90,130],[210,130],[150,235]],[[85,130],[100,90],[125,65],[150,57],[175,65],[200,90],[215,130]],[[142,25],[158,25],[158,50],[142,50]]],
  hard:[[[90,130],[150,130],[150,235]],[[150,130],[210,130],[150,235]],[[85,130],[100,90],[125,65],[150,57],[150,130]],[[150,57],[175,65],[200,90],[215,130],[150,130]],[[142,25],[158,25],[158,50],[142,50]]]},
 {id:'ghost',name:'👻 유령',
  easy:[[[70,100],[78,70],[100,45],[125,32],[150,28],[175,32],[200,45],[222,70],[230,100]],[[70,100],[230,100],[230,200],[70,200]],[[70,200],[123,200],[97,235]],[[123,200],[177,200],[150,235]],[[177,200],[230,200],[203,235]]],
  hard:[[[70,100],[78,70],[100,45],[125,32],[150,28],[150,100]],[[150,28],[175,32],[200,45],[222,70],[230,100],[150,100]],[[70,100],[230,100],[70,200]],[[230,100],[230,200],[70,200]],[[70,200],[123,200],[97,235]],[[123,200],[177,200],[150,235]],[[177,200],[230,200],[203,235]]]},
 {id:'turtle',name:'🐢 거북이',
  easy:[[[60,150],[70,110],[95,80],[130,65],[170,65],[205,80],[230,110],[240,150]],[[60,150],[240,150],[240,175],[60,175]],[[240,115],[275,115],[275,150],[240,150]],[[80,175],[115,175],[115,205],[80,205]],[[185,175],[220,175],[220,205],[185,205]]],
  hard:[[[60,150],[70,110],[95,80],[130,65],[150,65],[150,150]],[[150,65],[170,65],[205,80],[230,110],[240,150],[150,150]],[[60,150],[240,150],[240,175],[60,175]],[[240,115],[275,115],[275,150],[240,150]],[[80,175],[115,175],[115,205],[80,205]],[[185,175],[220,175],[220,205],[185,205]],[[60,150],[35,165],[60,175]]]},
 {id:'mushroom',name:'🍄 버섯',
  easy:[[[50,130],[65,95],[95,65],[130,50],[170,50],[205,65],[235,95],[250,130]],[[115,130],[185,130],[185,225],[115,225]],[[60,225],[240,225],[240,240],[60,240]]],
  hard:[[[50,130],[65,95],[95,65],[130,50],[150,50],[150,130]],[[150,50],[170,50],[205,65],[235,95],[250,130],[150,130]],[[115,130],[185,130],[185,175],[115,175]],[[115,175],[185,175],[185,225],[115,225]],[[60,225],[240,225],[240,240],[60,240]]]},
 {id:'kite',name:'🪁 연',
  easy:[[[150,20],[150,160],[90,90]],[[150,20],[210,90],[150,160]],[[145,165],[155,165],[155,240],[145,240]]],
  hard:[[[150,20],[150,90],[90,90]],[[150,20],[210,90],[150,90]],[[90,90],[150,90],[150,160]],[[150,90],[210,90],[150,160]],[[145,165],[155,165],[155,185],[145,185]],[[145,190],[155,190],[155,210],[145,210]],[[145,215],[155,215],[155,240],[145,240]]]},
 (()=>{const cx=150,cy=125,R=115,r=46,out=k=>{const a=(-90+72*k)*Math.PI/180;return [+(cx+R*Math.cos(a)).toFixed(1),+(cy+R*Math.sin(a)).toFixed(1)]},inn=k=>{const a=(-54+72*k)*Math.PI/180;return [+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)]};
   const tips=[0,1,2,3,4].map(k=>[out(k),inn((k+4)%5),inn(k)]),pent=[0,1,2,3,4].map(inn);
   return {id:'star',name:'⭐ 별',hard:[...tips,pent]};})()
];
function centroid(pts){let a=0,cx=0,cy=0;for(let i=0;i<pts.length;i++){const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];const f=x1*y2-x2*y1;a+=f;cx+=(x1+x2)*f;cy+=(y1+y2)*f;}a/=2;return [cx/(6*a),cy/(6*a)];}
function prep(def){ // 조각별 로컬 좌표 + 모양 키
  return def.map(pts=>{const [cx,cy]=centroid(pts);const loc=pts.map(([x,y])=>[+(x-cx).toFixed(1),+(y-cy).toFixed(1)]);
    const key=loc.map(p=>p.join(',')).sort().join('|');return {loc,cx:cx+OX,cy:cy+OY,key};});
}

// ---------- 소리 ----------
let audio=null;
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio;}
function tone(f,d=.15,type='triangle',v=.2,when=0){const c=ac(),t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
const sPick=()=>tone(440,.06,'sine',.08);
const sSnap=(n)=>{tone(660+n*70,.14,'triangle',.22);tone(990+n*70,.2,'sine',.12,.05);};
const sDone=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',.2,i*.07));
const sEnd=()=>[784,659,523,392].forEach((f,i)=>tone(f,.3,'triangle',.18,i*.11));
const sTick=(f)=>tone(f,.12,'square',.1);

// ---------- 화면 ----------
const NS='http://www.w3.org/2000/svg';
const lanesEl=$('lanes');
lanesEl.innerHTML=P.map((p,i)=>`
 <div class="lane" id="L${i}" style="--c:${p.c}">
  <div class="ltop"><span></span><span id="N${i}"></span><span class="pg" id="PG${i}"></span></div>
  <svg id="S${i}" viewBox="0 0 ${VW} ${VH}"><rect class="zone" x="4" y="276" width="${VW-8}" height="${VH-282}" rx="14"/><g id="SL${i}"></g><g id="PC${i}"></g></svg>
  <div class="okmark">✔</div>
 </div>`).join('');

let level=0,G=null,raf=0,timers=[];
const CFG=[{time:45,stars:[1,2,4]},{time:45,stars:[1,2,3]}];
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
function clearAll(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);document.querySelectorAll('.finger').forEach(e=>e.remove());}

function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
const ptsStr=loc=>loc.map(p=>p.join(',')).join(' ');

// 칸마다 다른 그림 (서로 겹치지 않게)
function deckNew(){return PUZZLES.map((p,i)=>(p[level?'hard':'easy']?i:-1)).filter(i=>i>=0).sort(()=>Math.random()-.5);}
function drawFromDeck(){ // 덱에서 한 장씩: 다 쓰기 전에는 같은 그림이 다시 나오지 않음
  if(!G.deck.length)G.deck=deckNew().filter(i=>!G.P.some(x=>x.pi===i));
  if(!G.deck.length)G.deck=deckNew();
  return G.deck.shift();
}
function pickPuzzles(){return [0,1,2,3].map(()=>drawFromDeck());}

function loadPuzzle(l,pi){
  const pz=PUZZLES[pi],pcs=prep(pz[level?'hard':'easy']);
  const S=G.P[l];S.pi=pi;S.done=false;S.placedN=0;S.total=pcs.length;
  $('L'+l).classList.remove('done');
  $('N'+l).textContent=pz.name;
  const slots=$('SL'+l),pieces=$('PC'+l);slots.innerHTML='';pieces.innerHTML='';
  S.slots=pcs.map(p=>({key:p.key,x:p.cx,y:p.cy,filled:false}));
  pcs.forEach((p,i)=>{ // 그림자 (쉬움: 조각 경계 힌트)
    const poly=mk('polygon',{class:'slot',points:ptsStr(p.loc),transform:`translate(${p.cx},${p.cy})`});
    if(!level){poly.style.stroke='#3b3b44';poly.style.strokeWidth='2';}else{poly.style.stroke='#1c1c22';poly.style.strokeWidth='1.5';}
    slots.appendChild(poly);
  });
  // 조각 흩뿌리기 (아래 영역, 3x3 칸에 섞기)
  const cells=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)cells.push([60+c*100,330+r*70]);
  cells.sort(()=>Math.random()-.5);
  S.pieces=pcs.map((p,i)=>{
    const [bx,by]=cells[i%cells.length];
    const el=mk('polygon',{class:'piece',points:ptsStr(p.loc)});
    el.style.fill=`color-mix(in srgb,${P[l].c} ${[100,82,66][i%3]}%,#fff)`;
    el.dataset.l=l;el.dataset.i=i;
    const hw=Math.max(...p.loc.map(q=>Math.abs(q[0])))+4,hh=Math.max(...p.loc.map(q=>Math.abs(q[1])))+4;
    const o={el,key:p.key,hw,hh,x:Math.max(hw+2,Math.min(VW-hw-2,bx+rnd(-18,18))),y:Math.max(280+hh,Math.min(VH-hh-6,by+rnd(-12,12))),placed:false,loc:p.loc};
    place(o);pieces.appendChild(el);return o;
  });
  $('PG'+l).textContent=`0 / ${S.total}`;
}
function place(o){o.el.setAttribute('transform',`translate(${o.x},${o.y})`);}

// ---------- 조작 ----------
const drags=new Map();
function svgPt(l,e){const s=$('S'+l),pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=s.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:0,y:0};}
lanesEl.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('.piece');
  if(!el||!G||G.phase!=='play')return;
  const l=+el.dataset.l,S=G.P[l],o=S.pieces[+el.dataset.i];
  if(!o||o.placed||S.done)return;
  e.preventDefault();
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  const p=svgPt(l,e);
  drags.set(e.pointerId,{l,o,dx:o.x-p.x,dy:o.y-p.y});
  o.el.classList.add('drag');o.el.parentNode.appendChild(o.el);sPick();
});
lanesEl.addEventListener('pointermove',e=>{
  const d=drags.get(e.pointerId);if(!d)return;
  const p=svgPt(d.l,e);
  d.o.x=Math.max(d.o.hw,Math.min(VW-d.o.hw,p.x+d.dx));d.o.y=Math.max(d.o.hh,Math.min(VH-d.o.hh,p.y+d.dy));place(d.o);
});
function end(e){const d=drags.get(e.pointerId);if(!d)return;drags.delete(e.pointerId);d.o.el.classList.remove('drag');drop(d.l,d.o);}
lanesEl.addEventListener('pointerup',end);lanesEl.addEventListener('pointercancel',end);

function drop(l,o,bot){
  if(!G||G.phase!=='play')return false;
  const S=G.P[l];
  let best=null,bd=1e9;
  S.slots.forEach(s=>{if(s.filled||s.key!==o.key)return;const d=Math.hypot(s.x-o.x,s.y-o.y);if(d<bd){bd=d;best=s;}});
  if(best&&bd<=SNAP){
    best.filled=true;o.x=best.x;o.y=best.y;o.placed=true;place(o);
    o.el.classList.add('placed');o.el.parentNode.insertBefore(o.el,o.el.parentNode.firstChild);
    S.placedN++;$('PG'+l).textContent=`${S.placedN} / ${S.total}`;sSnap(S.placedN);
    if(S.placedN===S.total)complete(l);
    return true;
  }
  return false;
}
function complete(l){
  const S=G.P[l];S.done=true;S.solved++;G.score++;sDone();
  $('L'+l).classList.add('done');drawScore();
  later(()=>{if(G&&G.phase==='play'){
    // 다음 그림: 현재 다른 칸들이 풀고 있는 그림과 겹치지 않게
    loadPuzzle(l,drawFromDeck());}},900);
}
function drawScore(){$('msg').textContent=`팀 점수 ${G.score}`;}

// ---------- 진행 ----------
function start(auto){
  clearAll();ac();drags.clear();
  const C=CFG[level];
  G={deck:deckNew(),phase:'play',auto:!!auto,t0:performance.now(),T:(auto?45:C.time)*1000,score:0,P:P.map(()=>({solved:0,pi:-1,pieces:[],slots:[]}))};
  const ids=pickPuzzles();
  P.forEach((_,i)=>loadPuzzle(i,ids[i]));
  $('fin').hidden=true;$('bStop').disabled=false;
  $('lv').textContent=(level?'어려움':'쉬움')+(auto?' · 시연':'');
  drawScore();
  const step=()=>{if(!G||G.phase!=='play')return;
    const left=Math.max(0,G.T-(performance.now()-G.t0));
    $('tb').style.transform=`scaleX(${left/G.T})`;$('rd').textContent=`⏱ ${Math.ceil(left/1000)}초`;
    if(left<=0){finish();return;}
    raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);
  sTick(880);
  if(auto)P.forEach((_,i)=>later(()=>bot(i),500+i*350));
}
function startPanel(){return `<div class="panel"><h2>준비됐나요?</h2><p>4명이 한 칸씩 맡으세요.<br>위의 <b>검은 그림자</b>에 맞게 조각을 끌어다 놓으면 딸깍! 붙어요.<br>다 맞추면 바로 다음 그림! <b>${CFG[0].time}초</b> 동안 팀 점수를 올려요.</p><button class="big" id="bStart2">▶ 시작하기</button></div>`;}
function showStart(){$('fin').hidden=false;$('fin').innerHTML=startPanel();$('bStart2').onclick=()=>start(false);}
function stop(){clearAll();G=null;drags.clear();$('bStop').disabled=true;$('rd').textContent='준비';$('msg').textContent='';$('lv').textContent='';$('tb').style.transform='scaleX(1)';
  P.forEach((_,i)=>{$('SL'+i).innerHTML='';$('PC'+i).innerHTML='';$('N'+i).textContent='';$('PG'+i).textContent='';$('L'+i).classList.remove('done');});showStart();}
function finish(){
  if(!G||G.phase!=='play')return;
  G.phase='end';clearAll();drags.clear();sEnd();
  const th=CFG[level].stars,sc=G.score,stars=sc>=th[2]?3:sc>=th[1]?2:sc>=th[0]?1:0;
  const mx=Math.max(1,...G.P.map(x=>x.solved));
  const bars=P.map((p,i)=>`<div style="display:grid;grid-template-columns:54px 1fr 46px;gap:10px;align-items:center;font-size:14px;font-weight:700;margin:6px 0;color:${p.c}"><span>${p.n}</span><div style="height:14px;border-radius:7px;background:#1d1d21;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(G.P[i].solved/mx*100)}%;background:${p.c}"></i></div><span>${G.P[i].solved}개</span></div>`).join('');
  $('fin').innerHTML=`<div class="panel"><div style="font-size:clamp(28px,6vw,48px);letter-spacing:.1em">${[0,1,2].map(i=>i<stars?'⭐':'☆').join('')}</div>
  <h2>⏰ 시간 끝!</h2><p>${level?'어려움':'쉬움'} · 완성한 그림 <b>${sc}</b>개</p>
  <div style="max-width:420px;margin:0 auto 14px;text-align:left">${bars}</div>
  <button class="big" id="again">↻ 다시 도전</button></div>`;
  $('fin').hidden=false;$('bStop').disabled=true;$('again').onclick=()=>start(false);$('rd').textContent='⏱ 0초';
}

// ---------- 자동 시연 봇: 조각을 집어서 슬롯까지 부드럽게 끌고 감 ----------
function bot(l){
  const run=()=>{
    if(!G||G.phase!=='play')return;
    const S=G.P[l];
    if(S.done){later(run,300);return;}
    const left=S.pieces.filter(p=>!p.placed);
    if(!left.length){later(run,300);return;}
    const o=left[Math.floor(Math.random()*left.length)];
    const slot=S.slots.find(s=>!s.filled&&s.key===o.key);
    if(!slot){later(run,300);return;}
    const sx=o.x,sy=o.y,dur=550+Math.random()*350,t0=performance.now();
    const f=document.createElement('div');f.className='finger';f.textContent='👆';f.style.background=P[l].c+'cc';f.style.boxShadow='0 0 16px '+P[l].c;document.body.appendChild(f);
    o.el.parentNode.appendChild(o.el);o.el.classList.add('drag');sPick();
    const tx=slot.x+rnd(-7,7),ty=slot.y+rnd(-7,7);
    const mv=()=>{
      if(!G||G.phase!=='play'||S.pi<0){f.remove();return;}
      const k=Math.min(1,(performance.now()-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      o.x=sx+(tx-sx)*e;o.y=sy+(ty-sy)*e;place(o);
      const r=$('S'+l).getBoundingClientRect(),sc=r.width/VW;
      f.style.left=(r.left+o.x*sc)+'px';f.style.top=(r.top+o.y*sc)+'px';
      if(k<1){requestAnimationFrame(mv);}
      else{o.el.classList.remove('drag');drop(l,o,true);f.remove();later(run,250+Math.random()*350);}
    };
    requestAnimationFrame(mv);
  };
  run();
}

document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',x===b));level=b.dataset.level==='hard'?1:0;}));
$('bStart').onclick=()=>start(false);$('bAuto').onclick=()=>start(true);$('bStop').onclick=stop;
showStart();
window.__pz={get G(){return G},start,drop,load:(l,pi)=>loadPuzzle(l,pi),N:()=>PUZZLES.length};
})();
</script>

<script>
(()=>{
if(!(window.__EMBED||/[?&]embed=1/.test(location.search)))return;

<script id="hw-turns">
(()=>{
if(!(window.__EMBED||/[?&]embed=1/.test(location.search)))return;
const CFG=Object.assign({tl:6,grace:0,manual:false,top:0},window.__TURN_CFG||{});
const COL=['#B26BE8','#4C9BFF','#FFB13B','#3DDC84'];
const stage=document.getElementById('stage');if(!stage)return;
const css=document.createElement('style');
css.textContent='.ov,.fin{z-index:20}.hwt{position:absolute;z-index:8;display:none;pointer-events:none;box-sizing:border-box;transition:background .25s;line-height:1.2;overflow:hidden}.hwt.off{display:block;background:rgba(2,0,0,.82);pointer-events:auto;touch-action:none}.hwt.on{display:block;box-shadow:inset 0 0 0 5px var(--c),inset 0 0 46px var(--c)}.hwt .pill{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;font:900 34px "Noto Sans KR",sans-serif;background:var(--c);color:#0b0b0d;padding:4px 22px;border-radius:40px;animation:hwp .7s ease-out}.hwt.on .pill{display:block}.hwt .bar{display:none;position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--c);transform-origin:left}.hwt.on .bar{display:block}.hwt .zz{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font:900 64px sans-serif;color:rgba(255,255,255,.22)}.hwt.off .zz{display:flex}@keyframes hwp{0%{transform:translateX(-50%) scale(1.5);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}';
document.body.appendChild(css);
const boxes=[0,1,2,3].map(i=>{const d=document.createElement('div');d.className='hwt';d.style.setProperty('--c',COL[i]);d.innerHTML='<div class="zz">⏳</div><div class="pill">내 차례!</div><div class="bar"></div>';
  ['pointerdown','touchstart','mousedown','click'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();e.stopPropagation();},{passive:false}));
  stage.appendChild(d);return d;});
let seq=[],last=-1;
function ensure(k){while(seq.length<=k){const p=[0,1,2,3].sort(()=>Math.random()-.5);if(p[0]===last){const t=p[0];p[0]=p[1];p[1]=t;}seq.push(...p);last=p[3];}}
function seqLane(k){ensure(k);return seq[k];}
const T={lane:-1,TL:CFG.tl,on:true,manual:CFG.manual,seqLane,reset(){seq=[];last=-1;},
  set(l,f){T._l=l;T._f=f==null?1:f;}};
window.__turns=T;
const ovs=()=>['ov','ovStart','ovEnd','fin'].some(id=>{const e=document.getElementById(id);return e&&!e.hidden&&e.style.visibility!=='hidden';});
function place(){
  const sr=stage.getBoundingClientRect(),cv=document.getElementById('cv');
  boxes.forEach((b,i)=>{
    const el=document.getElementById('L'+i);let r;
    if(el)r=el.getBoundingClientRect();
    else if(cv){const c=cv.getBoundingClientRect(),w=c.width/4,t=CFG.top*c.height;r={left:c.left+w*i,top:c.top+t,width:w,height:c.height-t};}
    else return;
    b.style.left=(r.left-sr.left)+'px';b.style.top=(r.top-sr.top)+'px';b.style.width=r.width+'px';b.style.height=r.height+'px';
  });
}
let was=false,t0=0,shown=-2;
function apply(lane,f){
  boxes.forEach((b,i)=>{const on=lane===i;b.classList.toggle('on',lane>=0&&on);b.classList.toggle('off',lane>=0&&!on);
    const bar=b.querySelector('.bar');if(on)bar.style.transform='scaleX('+Math.max(0,f)+')',bar.style.background=f<.25?'#ff3b3b':'';});
  if(lane!==T.lane){T.lane=lane;try{window.dispatchEvent(new CustomEvent('hwturn',{detail:lane}));}catch(_){}}
}
setInterval(()=>{
  place();
  const play=!ovs();
  if(!play){was=false;apply(-1,0);return;}
  if(!was){was=true;t0=performance.now()+CFG.grace;if(!T.manual)T.reset();}
  if(T.manual){apply(T._l==null?-1:T._l,T._f==null?1:T._f);return;}
  const el=performance.now()-t0;
  if(el<0){apply(-1,0);return;}
  const tl=CFG.tl*1000,k=Math.floor(el/tl);
  apply(seqLane(k),1-(el%tl)/tl);
},50);
})();
</script>
