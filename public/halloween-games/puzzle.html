<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>그림 퍼즐 맞추기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:#e8dccb;user-select:none;touch-action:none}
#wrap{position:absolute;left:0;top:0;width:1328px;height:747px;transform-origin:0 0;background:#000}

#hud{position:absolute;left:24px;right:24px;top:14px;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border:1px solid rgba(190,30,36,.5);background:rgba(10,3,4,.7);border-radius:12px;z-index:5}
#hud b{font-size:26px;color:#e0262e;text-shadow:0 0 10px rgba(224,38,46,.6);font-variant-numeric:tabular-nums}
#hud span{font-size:18px;color:#d4262c}
#bar{position:absolute;left:24px;right:24px;top:72px;height:5px;background:#2a0b0d;z-index:5;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:#c4262e;transform-origin:0 0}
#board{position:absolute;left:344px;top:96px;width:640px;height:480px;border:2px solid rgba(196,38,46,.7);box-shadow:0 0 30px rgba(196,38,46,.35),inset 0 0 40px #000;background:#050203;z-index:2}
#ghost{position:absolute;inset:0;background-size:100% 100%;opacity:.12;filter:grayscale(.6)}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(196,38,46,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(196,38,46,.35) 1px,transparent 1px);background-size:160px 160px}
#full{position:absolute;inset:0;background-size:100% 100%;opacity:0;transition:opacity .6s}
.pc{position:absolute;width:160px;height:160px;background-size:640px 480px;border:1px solid rgba(0,0,0,.6);box-shadow:0 6px 16px rgba(0,0,0,.8);cursor:grab;touch-action:none;z-index:10;transition:box-shadow .15s}
.pc.drag{cursor:grabbing;z-index:50;box-shadow:0 16px 30px rgba(0,0,0,.9),0 0 0 2px rgba(224,38,46,.8);transform:scale(1.06)}
.pc.ok{cursor:default;z-index:3;box-shadow:none;border-color:transparent;animation:snap .5s}
@keyframes snap{0%{filter:brightness(2.2)}100%{filter:none}}
#cnt{position:absolute;left:0;right:0;top:588px;text-align:center;font-size:18px;color:#d4262c;z-index:5}
#ov{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);gap:14px;text-align:center}
#ov h1{margin:0;font-size:56px;color:#e0262e;text-shadow:0 0 18px rgba(224,38,46,.7);letter-spacing:2px}
#ov p{margin:0;font-size:24px;color:#d4262c;line-height:1.5}
#ov .st{font-size:64px;letter-spacing:10px;color:#e0a53a}
#ov button{margin-top:10px;font:inherit;font-size:28px;padding:14px 46px;border-radius:12px;border:2px solid #c4262e;background:#3a0b0e;color:#d4262c;cursor:pointer}
#ov[hidden]{display:none}
#ff{position:absolute;inset:0;pointer-events:none;z-index:60;box-shadow:inset 0 0 160px rgba(0,0,0,.95)}
</style></head><body>
<div id="wrap">
 <div id="hud"><span>그림 퍼즐</span><b id="t">120</b><span id="sc">0 / 12</span></div>
 <div id="bar"><i id="bi"></i></div>
 <div id="board"><div id="ghost"></div><div id="grid"></div><div id="full"></div></div>
 <div id="cnt"></div><div id="ff"></div>
 <div id="ov" hidden></div>
</div>
<script>
(()=>{
const EMBED=/[?&]embed=1/.test(location.search);
const IMGS=['doll','book','skull','lady','skull2','door','frame'],COLS=4,ROWS=3,CW=160,CH=160,BX=344,BY=96,TIME=120,SNAP=44,PEEK=3500;
const _sn=new Audio('../sfx/snap.mp3');_sn.preload='auto';function snap(){try{const a=_sn.cloneNode();a.volume=1;const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
const $=id=>document.getElementById(id),wrap=$('wrap'),board=$('board');
let pieces=[],placed=0,left=TIME,timer=null,state='idle',img='',sent=false;
function fit(){const s=Math.min(innerWidth/1328,innerHeight/747);wrap.style.transform=`scale(${EMBED?innerWidth/1328:s})`;if(!EMBED){wrap.style.left=(innerWidth-1328*s)/2+'px';wrap.style.top=(innerHeight-747*s)/2+'px'}
 if(EMBED)parent.postMessage({hw:'h',h:Math.ceil(747*innerWidth/1328)},'*');}
addEventListener('resize',fit);fit();
function post(stars){if(sent)return;sent=true;setTimeout(()=>parent.postMessage({hw:'done',stars},'*'),EMBED?1800:99999999)}
function slots(){const a=[];for(const x of [0,160])for(let r=0;r<4;r++)a.push([24+x,88+r*(CH+4)]);for(const x of [0,160])for(let r=0;r<4;r++)a.push([1328-24-CW-x,88+r*(CH+4)]);return a}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let t0=0,solved=0,lastImg='',totalPlaced=0,done=[];
function start(){
 clearInterval(timer);timer=null;t0=0;solved=0;totalPlaced=0;left=TIME;sent=false;lastImg='';done=[];
 $('ov').hidden=true;$('t').textContent=TIME;$('bi').style.transform='scaleX(1)';
 round();
}
function round(){
 pieces.forEach(p=>p.el.remove());pieces=[];placed=0;
 const pool=IMGS.filter(x=>!done.includes(x));const n=pool[Math.random()*pool.length|0];img=lastImg=n;
 const url=`url(puzzle/${img}.jpg)`;
 $('ghost').style.backgroundImage=url;$('full').style.backgroundImage=url;
 $('sc').textContent='0 / 12';
 $('cnt').textContent='잘 보고 기억하세요…';$('full').style.opacity=1;$('ghost').style.opacity=0;state='peek';
 const sl=shuffle(slots()).slice(0,12);
 for(let i=0;i<12;i++){const c=i%COLS,r=i/COLS|0,el=document.createElement('div');el.className='pc';
  el.style.backgroundImage=url;el.style.backgroundPosition=`-${c*CW}px -${r*CH}px`;
  const [sx,sy]=sl[i];const rot=(Math.random()*10-5);
  Object.assign(el.style,{left:sx+'px',top:sy+'px',display:'none',transform:`rotate(${rot}deg)`});
  wrap.appendChild(el);const p={el,c,r,rot,placed:false};pieces.push(p);bind(p)}
 setTimeout(()=>{if(state!=='peek')return;$('full').style.opacity=0;$('ghost').style.opacity=0;pieces.forEach(p=>p.el.style.display='block');
  $('cnt').textContent='조각을 끌어서 제자리에 놓으세요';state='play';
  if(!timer){t0=performance.now();timer=setInterval(tick,250);}},PEEK);
}
function tick(){if(state==='end')return;left=Math.max(0,TIME-(performance.now()-t0)/1000);$('t').textContent=Math.ceil(left);$('bi').style.transform=`scaleX(${left/TIME})`;if(left<=0)end()}
function sc(){return EMBED?innerWidth/1328:Math.min(innerWidth/1328,innerHeight/747)}
function bind(p){const el=p.el;let id=null,ox=0,oy=0;
 el.addEventListener('pointerdown',e=>{if(state!=='play'||p.placed||id!==null)return;id=e.pointerId;el.setPointerCapture(id);const s=sc();ox=e.clientX/s-el.offsetLeft;oy=e.clientY/s-el.offsetTop;el.classList.add('drag');el.style.transform='rotate(0deg)';e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const s=sc();el.style.left=(e.clientX/s-ox)+'px';el.style.top=(e.clientY/s-oy)+'px'});
 const up=e=>{if(e.pointerId!==id)return;id=null;el.classList.remove('drag');
  const tx=BX+p.c*CW,ty=BY+p.r*CH,x=el.offsetLeft,y=el.offsetTop;
  if(Math.hypot(x-tx,y-ty)<SNAP){p.placed=true;snap();el.classList.add('ok');el.style.left=(tx-wrap.offsetLeft*0)+'px';el.style.top=ty+'px';placed++;totalPlaced++;$('sc').textContent=placed+' / 12';if(placed===12)won()}
  else{const nx=Math.max(0,Math.min(1328-CW,x)),ny=Math.max(80,Math.min(747-CH,y));el.style.left=nx+'px';el.style.top=ny+'px';el.style.transform=`rotate(${p.rot}deg)`}};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
function won(){if(state!=='play')return;state='won';solved++;done.push(img);$('full').style.opacity=1;$('cnt').textContent='완성! 다음 그림이 나와요…';
 setTimeout(()=>{if(state==='won'){if(left>6&&done.length<IMGS.length)round();else end()}},1800)}
function end(){if(state==='end')return;state='end';clearInterval(timer);timer=null;
 const stars=solved>=2?3:solved===1?2:totalPlaced>=6?1:0;
 $('cnt').textContent='';
 const ov=$('ov');ov.innerHTML=EMBED?`<h1>${stars>0?'다음 스테이지':'시간 종료'}</h1>`:`<h1>${solved>0?'시간 종료':'시간이 다 됐어…'}</h1><p>완성한 그림 ${solved}장</p><button id="rb">다시 하기</button>`;
 setTimeout(()=>{ov.hidden=false;if(!EMBED)$('rb').onclick=start},300);
 post(stars)}
window.__pz={get pieces(){return pieces},get state(){return state},start,end,get img(){return img},get solved(){return solved}};
{const ov=$('ov');ov.hidden=false;ov.innerHTML='<h1>그림 퍼즐</h1><p>흩어진 12조각을 맞춰 그림을 완성하세요<br>제한시간 2분</p><button id="sb">시작</button>';$('sb').onclick=start}
})();
</script></body></html>
